name: arepa-huevo-20261024-publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arepa-huevo-20261024-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Invalidate production recipe cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PYTHON'
          import os,json,urllib.request
          secret=(os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          if not secret:raise SystemExit('Missing cache secret')
          req=urllib.request.Request('https://manualdecocina.com/api/revalidate',data=b'{}',headers={'x-revalidate-secret':secret,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              assert json.load(r).get('revalidated') is True
          print('Production recipe cache invalidated')
          PYTHON
      - name: Audit seven localized pages and twelve public images
        run: python3 scripts/audit-arepa-huevo-20261024.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arepa-huevo-20261024-production-qa
          path: arepa-de-huevo-20261024-production-qa.json
