name: seven-new-20261029-publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-new-20261029-publication.yml'
      - 'editorial/seven-new-20261029/*-bundle.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            editorial/seven-new-20261029
            scripts/audit-seven-new-20261029.py
          sparse-checkout-cone-mode: false
      - name: Invalidate production recipe cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PYTHON'
          import os,json,urllib.request
          secret=(os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          if not secret:raise SystemExit('Missing cache secret')
          req=urllib.request.Request('https://manualdecocina.com/api/revalidate',data=b'{}',headers={'x-revalidate-secret':secret,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:assert json.load(r).get('revalidated') is True
          print('Production recipe cache invalidated')
          PYTHON
      - name: Verify published pages, schema, translations and discovery
        run: python3 scripts/audit-seven-new-20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-new-20261029-production-qa
          path: seven-new-20261029-production-qa.json
