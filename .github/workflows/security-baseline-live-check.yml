name: security-baseline-live-check
on:
  push:
    branches: [diagnostics/security-baseline-live-20261010]
    paths: ['.github/workflows/security-baseline-live-check.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report live response security headers and canonical host
        shell: bash
        run: |
          for url in 'https://manualdecocina.com/es' 'https://manualdecocina.com/arepas-de-choclo-con-queso' 'https://www.manualdecocina.com/es' 'https://manualdecocina.com/es/recetas?page=8'; do
            echo "PAGE: $url"
            curl -sS --max-time 30 -o /dev/null -D - -H 'Cache-Control: no-cache' "$url" | grep -iE '^(HTTP/|content-security-policy:|strict-transport-security:|cross-origin-opener-policy:|x-frame-options:|x-content-type-options:|referrer-policy:|location:|server:)' || true
            echo '---'
          done

# Post-merge recheck after security headers PR #127

# Repeat public header and www checks after scheduled deployment; no POST actions

# Audit next release headers and canonical consolidation after CMP fix


      - name: Inspect read-only public HTML for AdSense activation signals
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://manualdecocina.com/es',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read().decode('utf-8','replace')
          keys={
              'publicPublisherIdSerialized':bool(re.search(r'ca-pub-\\d+',body)),
              'googleAdsScriptReferenced':('adsbygoogle.js' in body),
              'googleCmpApiReferenced':('googlefc' in body),
              'privacyLinksPresent':('/es/cookies' in body and '/es/privacidad' in body),
              'obsoletePreferencesButton':('md-footer-cookie-btn' in body),
          }
          print('PUBLIC_ADS_DIAGNOSTIC',keys,'bytes',len(body))
          PY
