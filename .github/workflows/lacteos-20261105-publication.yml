name: lacteos-20261105-publication
on:
  push:
    branches: [main]
    paths:
      - 'editorial/lacteos-20261105/published.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: editorial/lacteos-20261105
      - name: Refresh protected production cache and verify collection
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          secret=os.environ['REVALIDATE_SECRET'].rstrip('\r\n')
          req=urllib.request.Request('https://manualdecocina.com/api/revalidate',data=b'{}',headers={'x-revalidate-secret':secret,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:assert json.load(r).get('revalidated') is True
          print('Production cache refreshed')
          PY
          python editorial/lacteos-20261105/collection-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lacteos-20261105-production-qa
          path: editorial/lacteos-20261105/live-qa.json
