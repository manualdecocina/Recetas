name: Performance audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/md/**'
      - 'src/app/consent.css'
      - 'src/app/[lang]/layout.tsx'
      - '.github/workflows/performance.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance.yml'
      - 'next.config.mjs'
      - 'src/app/site.css'
      - 'src/app/public-base.css'
      - 'src/app/fonts.ts'
      - 'src/components/md/**'
      - 'src/lib/md-data.ts'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm run start -- -p 3000 > /tmp/manualdecocina-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/es >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manualdecocina-next.log
          exit 1

      - name: Check Chrome
        run: google-chrome --version || chromium-browser --version || chromium --version

      - name: Audit critical mobile pages
        env:
          HOME_URL: http://127.0.0.1:3000/es
          RECIPE_URL: http://127.0.0.1:3000/canelones-de-carne-molida-con-pina
          TOOL_URL: http://127.0.0.1:3000/es/que-puedo-cocinar
        run: |
          set -euo pipefail
          # Retry only a failed trace recording, never a completed low score or
          # another audit failure. Keep every attempt log for diagnosis.
          run_lighthouse() {
            local audit_target="$1" audit_output="$2" audit_status=0 audit_attempt
            for audit_attempt in 1 2; do
              echo "Recording ${audit_output}, attempt ${audit_attempt}"
              if npm exec --yes --package=lighthouse@13.5.0 -- lighthouse "$audit_target" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --output=json --output-path="$audit_output" > "${audit_output}.attempt-${audit_attempt}.log" 2>&1; then
                cat "${audit_output}.attempt-${audit_attempt}.log"
                return 0
              else
                audit_status=$?
              fi
              cat "${audit_output}.attempt-${audit_attempt}.log"
              if [ "$audit_attempt" -eq 2 ] || ! python3 -c 'import pathlib,sys;sys.exit(0 if "NO_NAVSTART" in pathlib.Path(sys.argv[1]).read_text() else 1)' "${audit_output}.attempt-${audit_attempt}.log"; then
                return "$audit_status"
              fi
              echo "Retrying the failed navigation trace recording"
            done
          }

          # Warm the image optimizer, then retain the first successful measured
          # report. Device, throttling and scoring settings stay unchanged.
          run_lighthouse "$HOME_URL" home-warm.json
          run_lighthouse "$RECIPE_URL" recipe-warm.json
          run_lighthouse "$TOOL_URL" tool-warm.json
          run_lighthouse "$HOME_URL" home.json
          run_lighthouse "$RECIPE_URL" recipe.json
          run_lighthouse "$TOOL_URL" tool.json

      - name: Print performance summary
        run: |
          node <<'NODE'
          const fs = require('fs')
          for (const [label, file] of [['HOME','home.json'],['RECIPE','recipe.json'],['TOOL','tool.json']]) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'))
            const a = r.audits
            const score = Math.round((r.categories.performance.score || 0) * 100)
            const row = {
              score,
              FCP: a['first-contentful-paint']?.displayValue,
              LCP: a['largest-contentful-paint']?.displayValue,
              TBT: a['total-blocking-time']?.displayValue,
              CLS: a['cumulative-layout-shift']?.displayValue,
              SI: a['speed-index']?.displayValue,
            }
            console.log(label, JSON.stringify(row))
          }
          NODE

      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-critical-pages
          path: |
            home.json
            recipe.json
            tool.json
            *-warm.json
            *.attempt-*.log
          if-no-files-found: ignore
          retention-days: 14
