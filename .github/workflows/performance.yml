name: Performance audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm run start -- -p 3000 > /tmp/manualdecocina-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/es >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manualdecocina-next.log
          exit 1

      - name: Check Chrome
        run: google-chrome --version || chromium-browser --version || chromium --version

      - name: Audit critical mobile pages
        env:
          HOME_URL: http://127.0.0.1:3000/es
          RECIPE_URL: http://127.0.0.1:3000/canelones-de-carne-molida-con-pina
          TOOL_URL: http://127.0.0.1:3000/es/que-puedo-cocinar
        run: |
          set -euo pipefail
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse "$HOME_URL" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --output=json --output-path=home.json
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse "$RECIPE_URL" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --output=json --output-path=recipe.json
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse "$TOOL_URL" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --output=json --output-path=tool.json

      - name: Print performance summary
        run: |
          node <<'NODE'
          const fs = require('fs')
          for (const [label, file] of [['HOME','home.json'],['RECIPE','recipe.json'],['TOOL','tool.json']]) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'))
            const a = r.audits
            const score = Math.round((r.categories.performance.score || 0) * 100)
            const row = {
              score,
              FCP: a['first-contentful-paint']?.displayValue,
              LCP: a['largest-contentful-paint']?.displayValue,
              TBT: a['total-blocking-time']?.displayValue,
              CLS: a['cumulative-layout-shift']?.displayValue,
              SI: a['speed-index']?.displayValue,
            }
            console.log(label, JSON.stringify(row))
          }
          NODE

      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-critical-pages
          path: |
            home.json
            recipe.json
            tool.json
          if-no-files-found: ignore
          retention-days: 14
