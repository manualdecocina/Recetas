name: MySQL emergency remote preflight

on:
  pull_request:
    paths:
      - '.github/workflows/mysql-public-remote-preflight.yml'
      - 'src/lib/mysql/**'
      - 'src/lib/supabase/public.ts'
      - 'src/middleware.ts'
      - 'src/generated/published-recipe-slash-map.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check existing MySQL staging and production, read-only
        env:
          PREVIEW: https://mintcream-squirrel-383743.hostingersite.com
          PUBLIC: https://manualdecocina.com
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time
          def fetch(path):
              req = urllib.request.Request(path, headers={'User-Agent':'Manual-de-Cocina-GitHub-Preflight/1.0','Accept':'application/json,text/html'})
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=22) as r:
                          if r.status != 200:
                              raise RuntimeError(f"HTTP {r.status}: {path}")
                          return r.read(1_000_000).decode('utf-8',errors='replace')
                  except Exception as exc:
                      last = exc
                      if attempt < 2: time.sleep(2)
              raise RuntimeError(f"Unreachable {path}: {type(last).__name__}")
          base=os.environ['PREVIEW']
          cases=[
              ('adapter=1','mysql_adapter_pass'),
              ('editorial=1','admin_editorial_read_pass'),
              ('schema=admin','admin_schema_pass'),
          ]
          for suffix, expected in cases:
              raw=fetch(base+'/api/rescate-mysql?'+suffix)
              parsed=json.loads(raw)
              if parsed.get('status')!=expected or parsed.get('production_untouched') is not True:
                  raise RuntimeError('MySQL stage failed expected gate: '+suffix)
              if suffix=='adapter=1' and len(parsed.get('checks',{}))!=12:
                  raise RuntimeError('Adapter check count changed: must review')
              print('PASS staging',suffix,expected)
          for path,phrase in [('/es','Manual de Cocina'),('/es/recetas','recetas encontradas')]:
              html=fetch(os.environ['PUBLIC']+path)
              if phrase not in html:
                  raise RuntimeError('Production content does not match: '+path)
              print('PASS live',path)
          print('PASS: remote read-only preflight. This does NOT verify production MYSQL_* variables or staging deployment of this PR.')
          PY

      - name: Confirm active production MySQL routes without modifying production
        run: |
          python3 - <<'PY'
          import html, re, urllib.request
          base='https://manualdecocina.com'
          def fetch(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'Manual-de-Cocina-Migration-ReadOnly/1.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=25) as res:
                  if res.status!=200: raise RuntimeError(f'Unexpected HTTP {res.status} on {path}')
                  return html.unescape(res.read(1_500_000).decode('utf-8','replace'))
          login=fetch('/admin/login')
          if 'Panel de administración' not in login: raise RuntimeError('Login page did not render')
          if re.search(r'href=["\\\'](?:/admin/recuperar|https://manualdecocina.com/admin/recuperar)',login):
              raise RuntimeError('PRODUCTION ADMIN STILL ON SUPABASE: password recovery link present')
          print('PROVED: production ADMIN_AUTH_PROVIDER=mysql (Supabase recovery removed)')
          catalog=fetch('/es/recetas')
          local=('/recetas/helado-queso-cottage-fresas/portada.webp' in catalog or
                 '%2Frecetas%2Fhelado-queso-cottage-fresas%2Fportada.webp' in catalog)
          original=('eqbdtctxbpepbeickhqi.supabase.co/storage/v1/object/public/recetas/helado-queso-cottage-fresas/portada.webp' in catalog or
                    'eqbdtctxbpepbeickhqi.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Frecetas%2Fhelado-queso-cottage-fresas%2Fportada.webp' in catalog)
          if original: raise RuntimeError('PRODUCTION PUBLIC CATALOG STILL USING SUPABASE IMAGE URL')
          if not local: raise RuntimeError('Could not positively identify LOCAL MySQL-normalized cover URL in catalog')
          print('PROVED: production MYSQL_READS_ENABLED=true (cover URL rewritten by MySQL public adapter)')
          PY
