name: priority-hojuelas-publication-verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/priority-hojuelas-publication-verify.yml'
      - 'scripts/audit-priority-hojuelas-published.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate production cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          secret = (os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          if not secret:
              raise SystemExit('REVALIDATE_SECRET is missing from GitHub secrets')
          request = urllib.request.Request(
              'https://manualdecocina.com/api/revalidate',
              data=b'{}', method='POST',
              headers={'x-revalidate-secret': secret, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          if result.get('revalidated') is not True:
              raise SystemExit('Production did not confirm cache invalidation')
          print('Production confirmed cache invalidation')
          PY
      - name: Audit seven localized recipe pages and discovery surfaces
        run: python3 scripts/audit-priority-hojuelas-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-hojuelas-publication-audit
          path: priority-hojuelas-published-audit.json
