name: discovery-papa-20261028
on:
  push:
    branches: [fix/discovery-papa-20261028]
    paths:
      - '.github/workflows/discovery-papa-20261028.yml'
      - 'scripts/audit-discovery-papa-20261028.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            editorial/siete-mercados-20261027
      - name: Refresh protected publication cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          secret=(os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          if not secret:raise SystemExit('Missing publication cache secret')
          request=urllib.request.Request(
              'https://manualdecocina.com/api/revalidate?discovery='+str(time.time_ns()),
              data=b'{}',
              headers={'x-revalidate-secret':secret,'Content-Type':'application/json','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=40) as response:info=json.load(response)
          print(json.dumps({key:info.get(key) for key in ('revalidated','cacheMode','at')}))
          if info.get('revalidated') is not True or info.get('cacheMode')!='expire-now':
              raise SystemExit('Current immediate-expiration endpoint is not confirmed')
          PY
      - name: Check ordinary home/catalog URLs, navigation response and Papa
        run: python3 scripts/audit-discovery-papa-20261028.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-papa-20261028-qa
          path: discovery-papa-20261028-qa.json

