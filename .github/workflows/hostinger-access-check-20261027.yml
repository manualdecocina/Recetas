name: Refresh and verify seven-market publication
on:
  push:
    branches: [ops/hostinger-access-check-20261027]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refresh existing app cache and verify all 49 published pages
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,concurrent.futures
          groups=['1f07d138-ca88-4c8c-8b40-f052f43b9134','8c206415-7494-4077-8501-a61046095431','9ab5e2eb-de72-44b9-8024-e2ba13ef9530','ebd5b732-8694-4cd9-b24d-52f0c6e42f11','08c88198-fc8c-4a1a-8d83-a190815adad6','011dd8d1-b071-45af-95e6-607e977ef6e8','c099d1b2-4be4-4893-8f92-27536b517373']
          query=urllib.parse.urlencode({'select':'language,public_path','published':'eq.true','recipe_group_id':'in.('+','.join(groups)+')'})
          req=urllib.request.Request('https://eqbdtctxbpepbeickhqi.supabase.co/rest/v1/recipes?'+query,headers={'apikey':'sb_publishable_5j3BnF3q24MVuU-BTEVzbg_UXTyp6CM'})
          with urllib.request.urlopen(req,timeout=30) as r:rows=json.load(r)
          assert len(rows)==49 and all(sum(x['language']==l for x in rows)==7 for l in ['es','en','de','fr','it','ja','pt'])
          print('PUBLIC_RECIPES',len(rows))
          secret=(os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          assert secret,'Existing cache credential missing'
          req=urllib.request.Request('https://manualdecocina.com/api/revalidate?publication=siete-mercados-20261027',data=b'{}',headers={'x-revalidate-secret':secret,'Content-Type':'application/json','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=40) as r:info=json.load(r)
          assert info.get('revalidated') is True
          print('CACHE_REFRESH',json.dumps({k:info.get(k) for k in ['revalidated','cacheMode','at']}))
          def surface(pair):
              lang,suffix=pair;path='/'+lang+suffix
              req=urllib.request.Request('https://manualdecocina.com'+path+'?publicacion=siete-mercados-20261027',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:html=r.read().decode()
              missing=[x['public_path'] for x in rows if x['language']==lang and x['public_path'] not in html]
              assert not missing,(path,missing)
              return {'path':path,'new_recipes':7,'ok':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:report=list(pool.map(surface,[(l,s) for l in ['es','en','de','fr','it','ja','pt'] for s in ['','/recetas']]))
          print('SEVEN_MARKET_SURFACES',json.dumps(report))
          PY
