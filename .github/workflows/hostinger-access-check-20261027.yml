name: Refresh chop suey publication and verify navigation
on:
  push:
    branches: [ops/hostinger-access-check-20261027]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refresh existing app cache and verify seven-language navigation
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          from html.parser import HTMLParser
          base='https://manualdecocina.com'
          languages={'es','en','de','it','fr','ja','pt'}
          headers={'apikey':'sb_publishable_5j3BnF3q24MVuU-BTEVzbg_UXTyp6CM','Cache-Control':'no-cache'}
          req=urllib.request.Request('https://eqbdtctxbpepbeickhqi.supabase.co/rest/v1/recipes?select=language&published=eq.true&limit=2000',headers=headers)
          with urllib.request.urlopen(req,timeout=25) as response: rows=json.load(response)
          assert {row['language'] for row in rows}==languages,'API still truncates languages'
          print('PUBLIC_API_LANGUAGES '+json.dumps({'rows':len(rows),'languages':sorted({r['language'] for r in rows})}))
          secret=(os.environ.get('REVALIDATE_SECRET') or '').rstrip('\r\n')
          if not secret:raise SystemExit('Existing cache credential is missing')
          request=urllib.request.Request(base+'/api/revalidate?languages='+str(time.time_ns()),data=b'{}',headers={'x-revalidate-secret':secret,'Content-Type':'application/json','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=35) as response: info=json.load(response)
          assert info.get('revalidated') is True
          print('CACHE_REFRESH '+json.dumps({key:info.get(key) for key in ['revalidated','cacheMode','at']}))
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=set()
              def handle_starttag(self,tag,attrs):
                  data=dict(attrs)
                  if tag=='a' and 'md-lang-item' in data.get('class','').split():
                      self.links.add(data.get('href'))
          for attempt in range(6):
              failures=[];report=[]
              for lang in ['es','ja','pt']:
                  request=urllib.request.Request(base+'/'+lang,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=30) as response: html=response.read().decode()
                  page=Page();page.feed(html)
                  missing={'/'+code for code in languages-{lang}}-page.links
                  report.append({'page':'/'+lang,'links':sorted(page.links),'missing':sorted(missing)})
                  if missing:failures.append(lang)
              if not failures:
                  print('LIVE_LANGUAGE_NAVIGATION '+json.dumps(report,ensure_ascii=False))
                  break
              if attempt==5:
                  print('LIVE_LANGUAGE_NAVIGATION '+json.dumps(report,ensure_ascii=False))
                  raise SystemExit('Published navigation is still stale')
              time.sleep(5)
          for lang in sorted(languages):
              url=base+'/'+lang+'?publicacion=chop-suey-'+str(time.time_ns())
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=30) as response: html=response.read().decode()
              assert ('chop-suey' in html or 'chopsuey' in html or 'チョップスイレシピ' in html or '%E3%83%81%E3%83%A7%E3%83%83%E3%83%97' in html), 'Chop suey missing from home '+lang
              print('CHOP_SUEY_ON_HOME '+lang)
          PY
