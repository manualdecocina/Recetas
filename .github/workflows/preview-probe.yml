name: preview-probe
on:
  push:
    branches: [chore/preview-probe-20261007]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          set +e
          H=preview.manualdecocina.com
          emit() { printf '%s' "$2" | tr '\n\r' '  ' | cut -c1-900 | sed "s/^/::notice title=$1::/"; echo; }
          emit dns "$(getent ahostsv4 $H | head -2 | tr '\n' ' ') / v6: $(getent ahostsv6 $H | head -1)"
          for p in / /robots.txt /sitemap.xml /flan-de-leche-condensada /tiramisu /es /arroz-mixto; do
            for ua in "curl" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"; do
              out=$(curl -sS -m 25 -o /tmp/b -D - -A "$ua" "https://$H$p" 2>&1 | grep -iE '^(HTTP|server|location|x-powered|x-nextjs|cf-|x-vercel|via|x-hcdn|content-type|x-robots|retry-after|x-cache|platform)' | tr '\n\r' '  ')
              sz=$(wc -c </tmp/b 2>/dev/null)
              t=$(grep -o '<title>[^<]*' /tmp/b | head -1)
              emit "p$(echo "$p" | tr -c "a-z0-9" _)_${ua:0:4}" "$out | bytes=$sz | $t"
            done
          done
