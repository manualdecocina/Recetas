name: pantry-repair-live-qa
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/ingredient-labels.ts'
      - 'src/lib/md-data.ts'
      - 'src/lib/pantry-localization.ts'
      - 'editorial/pantry-ingredient-repair-20261009.json'
      - 'scripts/verify-pantry-repair.py'
      - '.github/workflows/pantry-repair-live-qa.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the current production deployment
        run: |
          python3 - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('https://manualdecocina.com/.well-known/quality-audit-20261103.txt?probe='+str(time.time_ns()),timeout=10) as response:
                      if 'manualdecocina-quality-20261103-v2' in response.read().decode(): break
              except Exception: pass
              if attempt==29: raise SystemExit('The expected production deployment is not live')
              time.sleep(15)
          PY
      - name: Verify seven languages after the automatic deployment
        run: |
          python - <<'PY'
          import subprocess, time
          for attempt in range(3):
              result = subprocess.run(["python", "scripts/verify-pantry-repair.py", "--base-url",
                  "https://manualdecocina.com", "--output", "pantry-live-qa.json"])
              if result.returncode == 0:
                  break
              if attempt == 2:
                  raise SystemExit(result.returncode)
              print("Waiting for deployed pages to refresh", flush=True)
              time.sleep(20)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantry-repair-seven-languages
          path: pantry-live-qa.json
          if-no-files-found: ignore
