name: lote05-prepublication
on:
  pull_request:
    paths:
      - 'editorial/**'
      - 'public/recetas/**'
      - 'scripts/*lote05*'
      - '.github/workflows/lote05-prepublication.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - run: python3 scripts/validate-lote05-complete.py
      - run: python3 scripts/build-lote05-publication.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lote05-prepublication-validation
          path: lote05-prepublication-validation.json
