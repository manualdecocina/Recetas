name: visitor-link-scan
on:
  push:
    branches: [diagnostics/visitor-link-scan-20261010]
    paths: ['.github/workflows/visitor-link-scan.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public link paths, assets, aliases, HTTP headers and Google speed API
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,html.parser,concurrent.futures,collections,json,ssl
          from xml.etree import ElementTree as ET
          site='https://manualdecocina.com'
          seeds=['/es','/en','/de','/fr','/it','/ja','/pt','/es/recetas','/es/categorias','/es/que-puedo-cocinar','/es/ingredientes','/receta-de-lechona-colombiana/','/arepas-de-choclo-con-queso','/es/contacto','/es/politica-editorial']
          class Parse(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[];self.img=[];self.altless=[];self.lang=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
                  if tag=='img':
                      self.img.append(a.get('src',''))
                      if 'alt' not in a:self.altless.append(a.get('src',''))
                  if tag=='html':self.lang=a.get('lang','')
          def get(url,ua='Mozilla/5.0 (compatible; SiteQualityCheck/1.0)'):
              try:
                  r=urllib.request.Request(url,headers={'User-Agent':ua})
                  with urllib.request.urlopen(r,timeout=20) as f:
                      dat=f.read(500000)
                      return {'code':f.status,'final':f.url,'body':dat.decode('utf8','replace'),'headers':dict(f.headers)}
              except urllib.error.HTTPError as e:
                  return {'code':e.code,'final':url,'body':e.read(1600).decode('utf8','replace'),'headers':dict(e.headers)}
              except Exception as e:return {'code':0,'final':url,'error':str(e)}
          visited={}; allLinks=set(); missingAlt=[]
          for path in seeds:
              url=site+path;r=get(url);visited[path]=r['code']
              if r['code']!=200:continue
              parser=Parse();parser.feed(r.get('body',''))
              for link in parser.links:
                  full=urllib.parse.urljoin(url,link)
                  u=urllib.parse.urlparse(full)
                  if u.netloc=='manualdecocina.com' and u.scheme=='https' and not u.query:
                      allLinks.add(urllib.parse.urlunparse((u.scheme,u.netloc,u.path,'','','')))
              missingAlt+= [(path,x) for x in parser.altless[:3]]
          allLinks=sorted(allLinks)
          scan=allLinks[:160]
          def checker(url):
              r=get(url)
              return (url.replace(site,''),r['code'],r.get('final'),r.get('error'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              checked=list(pool.map(checker,scan))
          anomalies=[{'path':p,'http':c,'final':f,'err':e} for p,c,f,e in checked if c!=200]
          for ua in ['Mozilla/5.0','Googlebot/2.1 (+http://www.google.com/bot.html)','Mozilla/5.0 (X11; Linux x86_64) HeadlessChrome/132.0 Safari/537.36']:
              r=get(site+'/es',ua)
              print('USER_AGENT',ua[:88],'HTTP',r['code'],'server',r.get('headers',{}).get('Server'),'sample',r.get('body','')[:100] if r['code']>=400 else '')
          print('VISITOR_AUDIT',json.dumps({'seedPages':visited,'uniqueLinksFound':len(allLinks),'checked':len(checked),'httpStatusDistribution':dict(collections.Counter(c for p,c,f,e in checked)),'non200Samples':anomalies[:60],'missingAltFirstSamples':missingAlt[:16]},ensure_ascii=False))
          url='https://www.googleapis.com/pagespeedonline/v5/runPagespeed?'+urllib.parse.urlencode({'url':site+'/es','strategy':'mobile'})
          try:
              with urllib.request.urlopen(url,timeout=75) as f:d=json.load(f)
              l=d.get('lighthouseResult') or {}
              scores={name:round(obj.get('score',0)*100) for name,obj in l.get('categories',{}).items() if isinstance(obj,dict) and obj.get('score') is not None}
              print('GOOGLE_PSI',json.dumps({'scores':scores,'fetchTime':l.get('fetchTime'),'finalUrl':l.get('finalDisplayedUrl'),'error':l.get('runtimeError'),'metrics':{k:l.get('audits',{}).get(k,{}).get('displayValue') for k in ['largest-contentful-paint','first-contentful-paint','total-blocking-time','cumulative-layout-shift']}},ensure_ascii=False))
          except Exception as e:print('GOOGLE_PSI_UNAVAILABLE',str(e)[:350])
          PY
