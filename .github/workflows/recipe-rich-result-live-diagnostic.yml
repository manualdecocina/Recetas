name: recipe-rich-result-live-diagnostic
on:
  push:
    branches: [diagnostics/recipe-schema-live-20261010]
    paths:
      - '.github/workflows/recipe-rich-result-live-diagnostic.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Recipe schema, rating, canonical and category snippets
        run: |
          python3 - <<'PY'
          import urllib.request,html.parser,json,html
          class Extract(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture=False;self.text=[];self.scripts=[];self.meta=[];self.canonical=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('type')=='application/ld+json':
                      self.capture=True;self.text=[]
                  if tag=='meta' and a.get('name')=='description': self.meta.append(a.get('content',''))
                  if tag=='link' and a.get('rel')=='canonical': self.canonical=a.get('href','')
              def handle_data(self,data):
                  if self.capture: self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.capture:
                      try: self.scripts.append(json.loads(''.join(self.text)))
                      except Exception: pass
                      self.capture=False
          for path in ['/arepas-de-choclo-con-queso','/receta-de-lechona-colombiana/','/es/categorias']:
              url='https://manualdecocina.com'+path
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (SEO QA)', 'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as f:
                  page=f.read().decode('utf-8','replace')
                  code=f.status
              p=Extract(); p.feed(page)
              recipes=[s for s in p.scripts if isinstance(s,dict) and s.get('@type')=='Recipe']
              if recipes:
                  a=recipes[0]
                  print('PAGE',path,'HTTP',code,'CANONICAL',p.canonical,'RATING',json.dumps(a.get('aggregateRating',{}),ensure_ascii=False),'PUBLISHER_LOGO',bool(a.get('publisher',{}).get('logo')),'STEP_URL',str((a.get('recipeInstructions') or [{}])[0].get('url',''))[:120])
              else:
                  print('PAGE',path,'HTTP',code,'CANONICAL',p.canonical,'DESCRIPTION',repr(p.meta[:1]),'RECIPE_SCHEMA_NONE')
          PY
