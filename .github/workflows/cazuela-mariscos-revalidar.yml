name: cazuela-mariscos-revalidar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cazuela-mariscos-revalidar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Invalidar caché de recetas
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          secret = os.environ.get('REVALIDATE_SECRET', '').rstrip('\r\n')
          if not secret: raise SystemExit('Missing cache secret')
          req = urllib.request.Request('https://manualdecocina.com/api/revalidate', data=b'{}', headers={'x-revalidate-secret': secret, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert json.load(response).get('revalidated') is True
          PY
