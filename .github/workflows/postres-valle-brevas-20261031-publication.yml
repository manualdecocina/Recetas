name: postres-valle-brevas-20261031-publication
on:
  push:
    branches: [main]
    paths:
      - 'editorial/manjar-blanco-del-valle-20261031.json'
      - 'editorial/dulce-de-breva-20261031.json'
      - 'public/recetas/manjar-blanco-del-valle/**'
      - 'public/recetas/dulce-de-breva/**'
      - '.github/workflows/postres-valle-brevas-20261031-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            editorial/manjar-blanco-del-valle-20261031.json
            editorial/dulce-de-breva-20261031.json
            scripts/audit-postres-valle-brevas-20261031.py
          sparse-checkout-cone-mode: false
      - name: Verify deployed media and fourteen-page production publication
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python3 scripts/audit-postres-valle-brevas-20261031.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postres-valle-brevas-20261031-production-qa
          path: postres-valle-brevas-20261031-production-qa.json
