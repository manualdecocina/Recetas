name: lote03-deployment-verify
on:
  push:
    branches: [main]
    paths:
      - 'editorial/lote-03-plan-20261008.json'
      - 'scripts/verify-lote03-media-http.py'
      - '.github/workflows/lote03-deployment-verify.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for actual media deployment, validating every HTTP response and SHA256
        run: |
          for attempt in $(seq 1 30); do
            if python3 scripts/verify-lote03-media-http.py; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lote03-media-deployment-verification
          path: lote03-media-deployment-verification.json
